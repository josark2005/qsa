services:
  postgres:
    image: postgres:18.6-alpine
    container_name: qsa-postgres
    environment:
      POSTGRES_DB: qsa
      POSTGRES_USER: qsa
      POSTGRES_PASSWORD: qsa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - qsa_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qsa -d qsa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qsa-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - qsa_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qsa_pgdata:
  qsa_redisdata:
