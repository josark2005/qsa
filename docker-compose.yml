name: qsa

x-backend-image: &backend-image "ghcr.io/josark2005/qsa-backend:${QSA_IMAGE_TAG:-latest}"
x-frontend-image: &frontend-image "ghcr.io/josark2005/qsa-frontend:${QSA_IMAGE_TAG:-latest}"

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qsa}
      POSTGRES_USER: ${POSTGRES_USER:-qsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - ./data/postgres:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  db-restore:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qsa}
      POSTGRES_USER: ${POSTGRES_USER:-qsa}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - ./data/bootstrap:/bootstrap:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ ! -f /bootstrap/qsa-full.dump ]; then
          echo "no qsa-full.dump; clean install"
          exit 0
        fi
        initialized=$(psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "SELECT to_regclass('public.users') IS NOT NULL")
        if [ "$$initialized" = "t" ]; then
          echo "database already initialized; skip restore"
          exit 0
        fi
        pg_restore -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
          --no-owner --no-privileges --single-transaction --exit-on-error \
          /bootstrap/qsa-full.dump
    restart: "no"

  migrate:
    image: *backend-image
    command: ["sh", "/app/docker/init.sh"]
    pull_policy: always
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qsa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qsa}
      REDIS_URL: redis://redis:6379/0
      HISTORY_DIR: /app/data/history
      HISTORY_AUTO_IMPORT: "false"
      QSA_REPORT_PDF_DIR: /app/data/reports
    volumes:
      - ./data:/app/data
    depends_on:
      db-restore:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    image: *backend-image
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    pull_policy: always
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qsa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qsa}
      REDIS_URL: redis://redis:6379/0
      HISTORY_DIR: /app/data/history
      HISTORY_AUTO_IMPORT: "false"
      QSA_REPORT_PDF_DIR: /app/data/reports
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: unless-stopped

  worker:
    image: *backend-image
    command: ["python", "-m", "app.worker"]
    pull_policy: always
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qsa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qsa}
      REDIS_URL: redis://redis:6379/0
      HISTORY_DIR: /app/data/history
      HISTORY_AUTO_IMPORT: "false"
      QSA_REPORT_PDF_DIR: /app/data/reports
    volumes:
      - ./data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: *frontend-image
    pull_policy: always
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
