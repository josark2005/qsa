name: CI/CD

# CI: backend tests, frontend lint/build, compose validation, Docker builds.
# CD: on main/tag pushes, push images to GHCR and optionally deploy over SSH.
#
# Required repository variable for deployment:
#   ENABLE_DEPLOY=true
#
# Required secrets for deployment:
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH
#   DEPLOY_PORT (optional, default 22)
#   DEPLOY_SSH_FINGERPRINT (optional but recommended)
#   GHCR_PULL_USER, GHCR_PULL_TOKEN (PAT with read:packages for the server)
#
# The server must already have a clone at DEPLOY_PATH, a .env.production,
# and the one-time data assets under data/history and data/bootstrap.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: qsa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.11"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.22.0"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
    steps:
      - name: Compute lowercase GHCR image prefix
        id: meta
        shell: bash
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_prefix=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Run backend tests
        working-directory: backend
        run: uv run pytest -q

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Build
        working-directory: frontend
        run: pnpm build

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate production and development compose files
        run: |
          cp .env.production.example .env.production
          cp .env.dev.example .env.dev
          docker compose --env-file .env.production -f docker-compose.prod.yml config > /dev/null
          docker compose --env-file .env.dev -f docker-compose.dev.yml config > /dev/null

  build-images:
    needs: [prepare, backend-tests, frontend-checks, compose-config]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ needs.prepare.outputs.image_prefix }}-${{ matrix.name }}:${{ github.sha }}
            ${{ needs.prepare.outputs.image_prefix }}-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: [prepare, build-images]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          envs: DEPLOY_PATH,DEPLOY_REF,IMAGE_PREFIX,IMAGE_TAG,GHCR_PULL_USER,GHCR_PULL_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            git fetch origin --prune --tags
            if git show-ref --verify --quiet "refs/remotes/origin/${DEPLOY_REF}"; then
              git checkout "${DEPLOY_REF}"
              git pull --ff-only origin "${DEPLOY_REF}"
            else
              git checkout --detach "${DEPLOY_REF}"
            fi

            if [ -n "${GHCR_PULL_TOKEN:-}" ]; then
              echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_PULL_USER" --password-stdin
            fi

            export QSA_BACKEND_IMAGE="${IMAGE_PREFIX}-backend:${IMAGE_TAG}"
            export QSA_FRONTEND_IMAGE="${IMAGE_PREFIX}-frontend:${IMAGE_TAG}"

            docker compose --env-file .env.production -f docker-compose.prod.yml pull
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans

            for attempt in $(seq 1 60); do
              if docker compose --env-file .env.production -f docker-compose.prod.yml \
                exec -T backend curl -fsS http://127.0.0.1:8000/api/health; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "backend health check failed" >&2
                exit 1
              fi
              sleep 5
            done

            docker image prune -f
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_REF: ${{ github.ref_name }}
          IMAGE_PREFIX: ${{ needs.prepare.outputs.image_prefix }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
