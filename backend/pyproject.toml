[project]
name = "qsa-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "akshare",
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "argon2-cffi>=25.1.0",
    "baostock",
    "croniter>=6.2.4",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "matplotlib>=3.11.2",
    "pandas",
    "psycopg[binary]>=3.3.6",
    "pyarrow",
    "pydantic-settings>=2.16.2",
    "redis>=8.1.0",
    "reportlab>=5.1.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx>=0.28.1",
    "pypdf>=6.21.4",
    "pytest>=9.2.0",
]
